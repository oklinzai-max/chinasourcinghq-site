<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t">
  <title id="t">Illustrated map of five China sourcing cities and the routes between them</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#d9e2ee"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0b2545" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1000" height="760" fill="#f6f9fc"/>
  <rect width="1000" height="760" fill="url(#dots)"/>

  <!-- soft land shape -->
  <path d="M120 100c140-54 260-30 350 4 100 38 190 20 280-8 108-34 190 14 200 96 8 66-38 106-28 176 12 82-52 140-140 152-92 12-128-24-214-14-120 14-160 76-252 68-92-8-136-74-118-152 12-52-26-92-16-160 8-62 30-118 78-162Z"
    fill="#eef4fa" opacity=".75"/>

  <!-- routes -->
  <path d="M236 330c40-96 250-186 400-118" fill="none" stroke="#d9541e" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
  <path d="M226 452c40 50 90 58 160 68" fill="none" stroke="#0b2545" stroke-width="3" stroke-dasharray="7 9" opacity=".45"/>
  <path d="M470 610c70-24 110-52 178-72" fill="none" stroke="#0b2545" stroke-width="3" stroke-dasharray="7 9" opacity=".45"/>
  <path d="M760 496c10-96 20-160 30-236" fill="none" stroke="#0b2545" stroke-width="3" stroke-dasharray="7 9" opacity=".35"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- Yiwu -->
    <g filter="url(#soft)">
      <rect x="600" y="104" width="330" height="152" rx="16" fill="#ffffff"/>
      <circle cx="636" cy="146" r="8" fill="#d9541e"/>
      <text x="662" y="156" font-size="36" font-weight="700" fill="#0b2545">Yiwu</text>
      <text x="636" y="196" font-size="22" fill="#6b7c93">Small commodities</text>
      <text x="636" y="226" font-size="20" fill="#93a4ba">Trade City · 5 districts</text>
    </g>

    <!-- Guangzhou -->
    <g filter="url(#soft)">
      <rect x="56" y="322" width="330" height="132" rx="16" fill="#0b2545"/>
      <circle cx="92" cy="364" r="8" fill="#d9541e"/>
      <text x="118" y="374" font-size="36" font-weight="700" fill="#ffffff">Guangzhou</text>
      <text x="92" y="416" font-size="22" fill="#b9cbe2">Canton Fair · wholesale</text>
    </g>

    <!-- Shenzhen -->
    <g filter="url(#soft)">
      <rect x="648" y="392" width="286" height="112" rx="16" fill="#ffffff"/>
      <circle cx="682" cy="430" r="8" fill="#0b2545"/>
      <text x="706" y="440" font-size="34" font-weight="700" fill="#0b2545">Shenzhen</text>
      <text x="682" y="480" font-size="22" fill="#6b7c93">Electronics</text>
    </g>

    <!-- Zhongshan -->
    <g filter="url(#soft)">
      <rect x="300" y="518" width="290" height="112" rx="16" fill="#ffffff"/>
      <circle cx="334" cy="556" r="8" fill="#0b2545"/>
      <text x="358" y="566" font-size="34" font-weight="700" fill="#0b2545">Zhongshan</text>
      <text x="334" y="606" font-size="22" fill="#6b7c93">Lighting · Guzhen</text>
    </g>

    <!-- Foshan -->
    <g filter="url(#soft)">
      <rect x="56" y="562" width="196" height="112" rx="16" fill="#ffffff"/>
      <circle cx="90" cy="600" r="8" fill="#0b2545"/>
      <text x="114" y="610" font-size="34" font-weight="700" fill="#0b2545">Foshan</text>
      <text x="90" y="650" font-size="22" fill="#6b7c93">Furniture</text>
    </g>

    <text x="856" y="712" font-size="20" fill="#93a4ba" text-anchor="end">Illustrative map — not to scale</text>
  </g>
</svg>
